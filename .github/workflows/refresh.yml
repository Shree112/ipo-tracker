# Frequent, cheap refreshes: GMP (InvestorGain + IPO Watch) and live
# subscription from three pages, no per-issue pages. The twice-daily full run
# (live.yml) still does the calendar, research blocks and the digest.
#
#   hourly     every hour, all days
#   close-day  every 5 minutes, 09:10-17:20 IST, weekdays - but only when a
#              mainboard issue closes that day; otherwise it exits in seconds.
#              Runs as two long jobs looping inside, because GitHub's own
#              5-minute cron is routinely delayed at busy times.
name: refresh

on:
  schedule:
    - cron: "20 * * * *"      # hourly, :50 IST
    - cron: "40 3 * * 1-5"    # 09:10 IST  close-day loop, morning half
    - cron: "40 7 * * 1-5"    # 13:10 IST  close-day loop, afternoon half
  workflow_dispatch:
    inputs:
      mode:
        description: "hourly = one light pass; closeday = 5-minute loop for 4 hours"
        type: choice
        options: [hourly, closeday]
        default: hourly

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    concurrency:
      # hourly passes queue behind each other; the two close-day loops never overlap
      group: refresh-${{ (github.event.schedule == '20 * * * *' || inputs.mode == 'hourly') && 'hourly' || 'closeday' }}
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_AGENT: ipo-tracker/0.1 (personal research project)
      REQUEST_DELAY_SECONDS: "2.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hourly pass
        if: github.event.schedule == '20 * * * *' || inputs.mode == 'hourly'
        run: python scripts/run_live.py --mode light
      - name: Digests due this hour
        if: github.event.schedule == '20 * * * *' || inputs.mode == 'hourly'
        run: python scripts/send_digests.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      - name: Close-day loop (morning half)
        if: github.event.schedule == '40 3 * * 1-5' || inputs.mode == 'closeday'
        run: python scripts/run_live.py --mode light --only-if-closing-today --loop-every 5 --until 13:15
      - name: Close-day loop (afternoon half)
        if: github.event.schedule == '40 7 * * 1-5'
        run: python scripts/run_live.py --mode light --only-if-closing-today --loop-every 5 --until 17:25
